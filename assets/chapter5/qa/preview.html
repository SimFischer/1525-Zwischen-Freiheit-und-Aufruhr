<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Kapitel 5 – Assetprüfung</title>
<link rel="stylesheet" href="../../../css/art-direction.css">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#342419;color:#f1dfbb;font-family:Georgia,serif}body{padding:12px}header{height:72px;display:flex;align-items:center;justify-content:space-between;gap:10px}h1{font-size:19px;margin:0}header p{font-size:14px;margin:3px 0}header button{min-height:44px;padding:8px 15px;color:#342419}.qa-stage{position:relative;margin:auto;width:min(calc(100vw - 24px),calc((100svh - 112px)*4/3),1024px);aspect-ratio:4/3;overflow:hidden}.qa-stage>img{position:absolute;width:100%;height:100%;object-fit:contain}.qa-person{position:absolute;object-fit:contain;max-width:none!important}.qa-ground{position:absolute;width:10%;height:1%;background:#34241955;border-radius:50%;filter:blur(3px);transform:translateX(-50%)}.qa-hotspot{position:absolute;transform:translate(-50%,-50%);z-index:5;max-width:28%;min-height:44px}.qa-dialogue{position:absolute;bottom:0;left:3%;right:3%;height:23%;padding:14px;border:3px solid #6b482c;background:var(--parchment-surface);color:#332319;box-shadow:var(--paper-edge);font-size:18px;line-height:1.3}.qa-dialogue p{margin:0}.qa-field{position:absolute;margin:0;padding:3px;text-align:left;color:#332319;font:18px/1.2 Georgia,serif;overflow:visible;background:none;border:0;box-shadow:none;border-radius:0;white-space:normal}.qa-report{line-height:1.15}.qa-field h2{font-size:18px;line-height:1.15;margin:0 0 7px}.qa-field p{margin:0}.qa-field:focus-visible,.qa-field[aria-pressed=true]{outline:3px solid #79562c;outline-offset:3px}.qa-risk{outline:3px dashed #79562c}.qa-note{font-size:15px;margin:6px 0;text-align:center}
.qa-ui header{position:absolute;left:18px;right:18px;top:12px;height:44px;z-index:10}.qa-ui header p{display:none}.qa-ui .qa-stage{width:min(calc(100vw - 24px),calc((100svh - 24px)*4/3),1024px)}.qa-ui .qa-note{position:fixed;bottom:2px;left:12px;right:12px;font-size:12px;background:#342419;color:#f1dfbb;z-index:10}
</style>
<header><div><h1 id="title">Kapitel 5</h1><p id="mode">Asset-Testkomposition, keine Spielszene</p></div><button id="toggle">Dialog zeigen</button></header><main class="qa-stage room" id="stage"></main><p class="qa-note" id="note"></p>
<script type="module">
import{hotspot}from '../../../js/hotspots.js';
const data=await(await fetch('./fixtures.json')).json(),q=new URLSearchParams(location.search),stage=document.querySelector('#stage'),scene=data.scenes.find(s=>s.id===q.get('scene'))||data.scenes[0],ui=q.get('ui');let selected=[],risk=null;
function img(path,cls=''){const i=document.createElement('img');i.src='/'+path;i.className=cls;stage.append(i);return i;}
if(ui){document.body.classList.add('qa-ui');document.querySelector('#title').textContent={theological_arguments_table:'Vier Argumente prüfen',luther_four_thoughts:'Luthers Gedanken zusammen lesen',three_reports:'Drei Berichte zum Zusammenstoß',religion_functions:'Zwei Funktionen und ein Risiko'}[ui];document.querySelector('#toggle').textContent='Auswahl zurücksetzen';img('assets/chapter5/ui/ch5_ui_'+ui+'.png');data.regions[ui].forEach(([x,y,w,h],n)=>{const field=document.createElement(ui==='religion_functions'?'button':'section');field.className='qa-field'+(ui==='three_reports'?' qa-report':'');field.style.cssText=`left:${x}%;top:${y}%;width:${w}%;height:${h}%`;field.innerHTML=`<h2>${data.texts[ui][n][0]}</h2><p>${data.texts[ui][n][1]}</p>`;if(field.tagName==='BUTTON'){field.setAttribute('aria-pressed','false');field.onclick=()=>{if(selected.includes(n))selected=selected.filter(v=>v!==n);else if(selected.length<2)selected.push(n);else risk=n;document.querySelectorAll('.qa-field').forEach((f,i)=>{f.setAttribute('aria-pressed',String(selected.includes(i)));f.classList.toggle('qa-risk',risk===i);});document.querySelector('#note').textContent=`${selected.length} Funktionen gewählt${risk===null?'':'; Risiko: '+data.texts[ui][risk][0]}`;};}stage.append(field);});document.querySelector('#note').textContent='Redaktioneller Texttest: Zusammenfassungen und erfundene Berichte, keine Quellenzitate.';document.querySelector('#toggle').onclick=()=>location.reload();}
else{document.querySelector('#title').textContent=scene.purpose;img(scene.background);for(const overlay of(q.get('overlay')||'').split(',').filter(Boolean)){const layer=img('assets/chapter5/overlays/ch5_overlay_'+overlay+'.png','qa-overlay'),r=data.registrations[overlay];layer.dataset.overlay=overlay;layer.style.cssText=`width:${r.scale*100}%;height:${r.scale*100}%;left:${r.left}%;top:${r.top}%`;}for(const f of scene.figures){const c=data.canon[f.id],[l,t,r,b]=c.bounds,k=f.bodyHeight/(b-t),ground=document.createElement('span');ground.className='qa-ground';ground.style.cssText=`left:${f.x}%;top:${f.footline-.2}%`;stage.append(ground);const p=img(c.asset,'qa-person');p.dataset.person=f.id;p.dataset.facing=f.facing;p.style.cssText=`height:${c.height*k}%;width:${c.width*k*.75}%;left:${f.x-(f.mirror?c.width-r:l)*k*.75-(r-l)*k*.75/2}%;top:${f.footline-b*k}%;transform:${f.mirror?'scaleX(-1)':'none'}`;p.alt=f.id;}stage.insertAdjacentHTML('beforeend',hotspot(scene.hotspot.label,'qa',{kind:scene.hotspot.kind,classes:'qa-hotspot hotspot-sign',attrs:`style="left:${scene.hotspot.x}%;top:${scene.hotspot.y}%"`}));const dialog=document.createElement('section');dialog.className='qa-dialogue';dialog.hidden=true;dialog.innerHTML='<p><strong>Verantwortung unter Unsicherheit</strong><br>Welche Folgen hat unser Handeln für die Menschen, die jetzt auf Hilfe angewiesen sind?</p>';stage.append(dialog);document.querySelector('#toggle').onclick=()=>{dialog.hidden=!dialog.hidden;document.querySelector('.qa-hotspot').hidden=!dialog.hidden;};document.querySelector('#note').textContent='Originale Canon-Figuren separat; diese Komposition niemals als Runtime-Hintergrund verwenden.';}
window.qaReady=true;
</script></html>
